<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <main>
            <div class="saidaLayout">
                <p id="saida"></p>
            </div>

            <div class="buttons">
                <button class="numero" value="1">1</button>
                <button class="numero" value="2">2</button>
                <button class="numero" value="3">3</button>
                <button class="operador" value="soma">+</button>
            </div>

            <div class="buttons">
                <button class="numero" value="4">4</button>
                <button class="numero" value="5">5</button>
                <button class="numero" value="6">6</button>
                <button class="operador" value="subtracao">-</button>
            </div>

            <div class="buttons">
                <button class="numero" value="7">7</button>
                <button class="numero" value="8">8</button>
                <button class="numero" value="9">9</button>
                <button class="operador" value="multiplicacao">x</button>
            </div>

            <div class="buttons">
                <button id="delete" value="deletar">c</button>
                <button class="numero" value="0">0</button>
                <button id="igual" value="igual">=</button>
                <button class="operador" value="divisao">/</button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
